<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>할매봇 운영 대시보드</title>
<style>
  :root {
    --bg:#0a0e16; --surface:#10151f; --surface-2:#161d2b; --line:#232c3d;
    --text:#e7eaf0; --dim:#7c8aa3; --amber:#e8a33d; --green:#3ddc97; --red:#e05c5c; --blue:#4f9cf0; --gray:#3a4558;
    --font:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; font-size:14px; }
  a { color:var(--blue); }
  .header { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line); padding:16px 24px 12px; }
  .header h1 { margin:0; font-size:22px; letter-spacing:-0.02em; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .health { font-size:12px; padding:3px 10px; border-radius:4px; border:1px solid var(--line); color:var(--dim); }
  .health.ok { color:var(--green); border-color:rgba(61,220,151,.4); }
  .health.warn { color:var(--amber); border-color:var(--amber); }
  .health.fail { color:var(--red); border-color:var(--red); }
  .sub { color:var(--dim); font-size:12px; margin-top:6px; font-variant-numeric:tabular-nums; }
  .sub.stale { color:var(--red); }
  .wrap { max-width:1400px; margin:0 auto; padding:20px 24px 60px; display:grid; gap:20px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .card-head { background:#0b0f18; border-bottom:1px solid var(--line); padding:10px 16px; font-weight:700; font-size:14px; display:flex; justify-content:space-between; align-items:center; }
  .card-head .meta { font-weight:400; color:var(--dim); font-size:12px; }
  .card-body { padding:16px; }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:900px) { .grid-2 { grid-template-columns:1fr; } }

  /* 파이프라인 */
  .pipe { margin-bottom:22px; }
  .pipe:last-child { margin-bottom:0; }
  .pipe-title { font-size:13px; color:var(--dim); margin-bottom:10px; display:flex; gap:10px; align-items:center; }
  .pipe-title b { color:var(--text); }
  .pipe-flow { display:flex; align-items:stretch; gap:0; overflow-x:auto; padding-bottom:6px; }
  .node { position:relative; min-width:150px; flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-right:26px; }
  .node:last-child { margin-right:0; }
  .node::after { content:'›'; position:absolute; right:-19px; top:50%; transform:translateY(-50%); color:var(--gray); font-size:20px; }
  .node:last-child::after { content:''; }
  .node .n-title { font-size:13px; font-weight:700; margin-bottom:2px; display:flex; align-items:center; gap:6px; }
  .node .n-desc { font-size:11px; color:var(--dim); line-height:1.4; min-height:30px; }
  .node .n-status { font-size:11px; margin-top:6px; font-variant-numeric:tabular-nums; color:var(--dim); }
  .node .dot { width:8px; height:8px; border-radius:50%; background:var(--gray); flex-shrink:0; }
  .node.ok { border-color:rgba(61,220,151,.5); } .node.ok .dot { background:var(--green); }
  .node.fail { border-color:var(--red); background:rgba(224,92,92,.08); } .node.fail .dot { background:var(--red); }
  .node.warn { border-color:var(--amber); } .node.warn .dot { background:var(--amber); }
  .node.skip { opacity:.55; }
  .node.backup { border-style:dashed; }
  .node .n-note { font-size:11px; color:var(--amber); margin-top:4px; }

  /* 표 */
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--dim); font-weight:500; font-size:11px; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:none; }
  .tag { display:inline-block; font-size:11px; padding:2px 7px; border-radius:3px; background:var(--surface-2); color:var(--dim); white-space:nowrap; }
  .tag.ok { color:var(--green); background:rgba(61,220,151,.12); }
  .tag.fail { color:var(--red); background:rgba(224,92,92,.14); }
  .tag.warn { color:var(--amber); background:rgba(232,163,61,.12); }
  .tag.host { color:var(--blue); background:rgba(79,156,240,.12); }
  .muted { color:var(--dim); }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }

  /* 타임라인 */
  .tl { display:grid; grid-template-columns:repeat(144,1fr); gap:1px; height:34px; }
  .tl div { background:var(--gray); border-radius:1px; opacity:.35; }
  .tl div.ok { background:var(--green); opacity:.9; }
  .tl div.fail { background:var(--red); opacity:1; }
  .tl div.warn { background:var(--amber); opacity:.9; }
  .tl-axis { display:flex; justify-content:space-between; font-size:10px; color:var(--dim); margin-top:4px; font-variant-numeric:tabular-nums; }
  .kbo-marks { position:relative; height:18px; margin-top:6px; }
  .kbo-marks span { position:absolute; top:0; transform:translateX(-50%); font-size:10px; padding:1px 5px; border-radius:3px; background:var(--surface-2); color:var(--dim); white-space:nowrap; }
  .kbo-marks span.ok { color:var(--green); } .kbo-marks span.fail { color:var(--red); }
  .stat-row { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .stat { background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:8px 14px; min-width:110px; }
  .stat .v { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat .k { font-size:11px; color:var(--dim); }
  .stat.red .v { color:var(--red); } .stat.green .v { color:var(--green); } .stat.amber .v { color:var(--amber); }
  .bar { height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; background:var(--amber); }
  .bar.ok i { background:var(--green); } .bar.warn i { background:var(--amber); } .bar.fail i { background:var(--red); }
  .hl-item { padding:8px 0; border-bottom:1px dashed var(--line); font-size:12px; }
  .hl-item:last-child { border-bottom:none; }
  .hl-item .h { display:flex; justify-content:space-between; gap:8px; color:var(--dim); font-size:11px; margin-bottom:3px; }
  .hl-item .claim { color:var(--red); }
  .hl-item .fact { color:var(--text); margin-top:2px; }
  .rules li { margin:3px 0; font-size:12px; }
  .empty { color:var(--dim); font-size:12px; padding:14px 0; text-align:center; }
  details summary { cursor:pointer; color:var(--dim); font-size:12px; }
  pre.log { background:#0b0f18; border:1px solid var(--line); border-radius:6px; padding:10px; font-size:11px; max-height:220px; overflow:auto; white-space:pre-wrap; color:var(--dim); }
</style>
</head>
<body>

<div class="header">
  <h1>할매봇 운영 대시보드 <span class="health" id="health">데이터 없음</span></h1>
  <div class="sub" id="sub">ops_status.js 대기 중 — 파이프라인 맵은 설계도로 표시됩니다</div>
</div>

<div class="wrap">
  <div class="card">
    <div class="card-head">파이프라인 맵 <span class="meta">최근 실행 기준 단계별 상태</span></div>
    <div class="card-body" id="pipelines"></div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-head">크론 잡 <span class="meta" id="cron-meta"></span></div>
      <div class="card-body" id="crons"></div>
    </div>
    <div class="card">
      <div class="card-head">데이터 상태 <span class="meta">토토 / KBO</span></div>
      <div class="card-body" id="datastat"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">24시간 실행 타임라인 <span class="meta" id="tl-meta"></span></div>
    <div class="card-body" id="timeline"></div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-head">hallucination_log <span class="meta" id="hl-meta"></span></div>
      <div class="card-body" id="hallu"></div>
    </div>
    <div class="card">
      <div class="card-head">메모리 · 운영 규칙</div>
      <div class="card-body" id="memrules"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">최근 로그 발췌 <span class="meta">각 파이프라인 마지막 실행</span></div>
    <div class="card-body" id="logs"></div>
  </div>
</div>

<script src="ops_status.js"></script>
<script>
(function () {
  // ─────────────────────────────────────────────────────────────
  // window.OPS_STATUS 계약 (할매봇이 갱신). 모든 필드는 선택 — 없으면 해당 부분만 비어 보임.
  // {
  //   generated_at: ISO,
  //   crons: [{id, name, schedule_utc:"*/10 * * * *", last_run: ISO, last_status:"ok"|"error", next_run: ISO, source:"hermes"|"host", note}],
  //   pipelines: {
  //     kbo:  { last_run: ISO, steps: { <step_id>: {status:"ok"|"fail"|"warn"|"skip", at: ISO, duration_s: n, note} } },
  //     toto: { last_run: ISO, steps: { ... } }
  //   },
  //   runs_24h: [{ts: ISO, pipeline:"toto"|"kbo", status:"ok"|"fail"|"warn", parse_drop:n, verify:"PASS"|"FAIL", appended:n, note}],
  //   hallucination_log: [{timestamp, project, false_claim, actual_finding, corrected_by, task_context}],
  //   data: {
  //     toto: {generated_at, round, rows, history_keys, history_changed_keys, verify, parse_drop, pages_ok:true},
  //     kbo:  {latest_file, latest_date, games, verify, verify_at, collected_at}
  //   },
  //   memory: {usage_pct, entries, max},
  //   rules: [{id:"§1", title}],
  //   logs: { kbo: "...tail...", toto: "...tail..." }
  // }
  // step_id 목록은 아래 PIPE_DEF 참고. 할매봇은 step_id를 그대로 써야 함.
  // ─────────────────────────────────────────────────────────────
  var S = window.OPS_STATUS || null;

  var PIPE_DEF = {
    kbo: {
      title: 'KBO 일일 수집', sched: '매일 21:00 KST (hermes cron 9d94852fc0c6)',
      steps: [
        { id:'cron',      t:'hermes cron',        d:'12:00 UTC 트리거 → kbo_poll_daily.sh' },
        { id:'collect',   t:'collector_thread',   d:'경기 목록 fetch(90조합) → 경기별 스레드 폴링 → FINAL 저장' },
        { id:'kbo_check', t:'KBO검증',            d:'기대 경기 수 vs 저장 수 대조, 누락 시 텔레그램' },
        { id:'accum',     t:'누적 갱신',           d:'season_stats.json 시즌 누적' },
        { id:'validate',  t:'validate_kbo_json',  d:'필드 화이트리스트, 금지 필드 자동 제거' },
        { id:'send',      t:'데이터 전송',         d:'kbo_review_YYYY-MM-DD.json 텔레그램 첨부' },
        { id:'verify',    t:'verify_kbo_daily',   d:'이닝합계 재계산·팀명·점수 검수 → PASS/FAIL 알림' },
        { id:'backup',    t:'백업 검수',           d:'호스트 crontab 23:10 KST, 같은 검수 재실행', backup:true }
      ]
    },
    toto: {
      title: '토토 10분 폴링', sched: '*/10 * * * * (hermes cron 637e72784f02) · 일일 요약 09:00 KST',
      steps: [
        { id:'cron',     t:'hermes cron',       d:'10분마다 toto_poll_daily.sh' },
        { id:'fetch',    t:'라이브 fetch',       d:'메인 페이지 → 회차/seq 동적 추출 → get_proto_list.htm' },
        { id:'parse',    t:'파싱',              d:'a9 셀 개수 기반 홈/무/원정, 라벨 d1/d5/hm/hp/un, 화살표 정리' },
        { id:'verify',   t:'verify_toto',       d:'팀명 빈 행·2-way 오분류·parse_drop → FAIL 시 알림' },
        { id:'files',    t:'데이터 파일',        d:'toto_data.js · odds_history.js · status.js · archive' },
        { id:'push',     t:'git push',          d:'commit --amend + force push' },
        { id:'pages',    t:'GitHub Pages',      d:'대시보드 갱신 (캐시 10분)' }
      ]
    }
  };

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function kst(iso){ if(!iso) return '-'; var d=new Date(iso); if(isNaN(d.getTime())) return String(iso); return d.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  function kstTime(iso){ if(!iso) return '-'; var d=new Date(iso); if(isNaN(d.getTime())) return String(iso); return d.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',hour12:false,hour:'2-digit',minute:'2-digit'}); }
  function ago(iso){ if(!iso) return ''; var m=Math.round((Date.now()-new Date(iso).getTime())/60000); if(isNaN(m)) return ''; return m<1?'방금':m<60?m+'분 전':Math.round(m/60)+'시간 전'; }
  function statusTag(s){ var c=s==='ok'||s==='PASS'?'ok':s==='fail'||s==='error'||s==='FAIL'?'fail':s==='warn'?'warn':''; return '<span class="tag '+c+'">'+esc(s||'-')+'</span>'; }
  // cron 문자열을 KST 설명으로 (분/시 고정값만 처리)
  function cronToKst(c){
    if(!c) return '-';
    var p=String(c).trim().split(/\s+/); if(p.length<5) return esc(c);
    var min=p[0], hr=p[1];
    if(min.indexOf('*/')===0 && hr==='*') return min.slice(2)+'분 간격';
    if(/^\d+$/.test(min) && /^\d+$/.test(hr)){ var h=(parseInt(hr,10)+9)%24; return '매일 '+String(h).padStart(2,'0')+':'+String(parseInt(min,10)).padStart(2,'0')+' KST'; }
    return esc(c)+' (UTC)';
  }

  // ── 헤더 ──
  function renderHeader(){
    var h=document.getElementById('health'), sub=document.getElementById('sub');
    if(!S){ return; }
    var stale = S.generated_at ? (Date.now()-new Date(S.generated_at).getTime())/60000 > 30 : true;
    var fails=0, warns=0;
    ['kbo','toto'].forEach(function(p){ var st=S.pipelines&&S.pipelines[p]&&S.pipelines[p].steps||{}; Object.keys(st).forEach(function(k){ if(st[k].status==='fail')fails++; else if(st[k].status==='warn')warns++; }); });
    (S.crons||[]).forEach(function(c){ if(c.last_status&&c.last_status!=='ok')fails++; });
    var cls = stale?'fail':fails?'fail':warns?'warn':'ok';
    var txt = stale?'상태 파일 갱신 지연':fails?'실패 '+fails+'건':warns?'경고 '+warns+'건':'전체 정상';
    h.className='health '+cls; h.textContent=txt;
    sub.className='sub'+(stale?' stale':'');
    sub.textContent='ops_status.js 갱신: '+kst(S.generated_at)+' ('+ago(S.generated_at)+')'+(stale?' · 30분 이상 갱신 없음 — 생성 크론 확인 필요':'');
  }

  // ── 파이프라인 ──
  function renderPipelines(){
    var el=document.getElementById('pipelines'); var html='';
    Object.keys(PIPE_DEF).forEach(function(key){
      var def=PIPE_DEF[key]; var live=S&&S.pipelines&&S.pipelines[key]||null;
      html+='<div class="pipe"><div class="pipe-title"><b>'+esc(def.title)+'</b><span>'+esc(def.sched)+'</span>'+(live&&live.last_run?'<span>· 마지막 실행 '+kst(live.last_run)+' ('+ago(live.last_run)+')</span>':'<span>· 실행 기록 없음</span>')+'</div><div class="pipe-flow">';
      def.steps.forEach(function(st){
        var s=live&&live.steps&&live.steps[st.id]||null;
        var cls=s?(s.status||''):'';
        html+='<div class="node '+cls+(st.backup?' backup':'')+'"><div class="n-title"><span class="dot"></span>'+esc(st.t)+'</div><div class="n-desc">'+esc(st.d)+'</div>';
        if(s){ html+='<div class="n-status">'+kstTime(s.at)+(s.duration_s!=null?' · '+s.duration_s+'s':'')+(s.status?' · '+esc(s.status):'')+'</div>'; if(s.note) html+='<div class="n-note">'+esc(s.note)+'</div>'; }
        else html+='<div class="n-status">상태 없음</div>';
        html+='</div>';
      });
      html+='</div></div>';
    });
    el.innerHTML=html;
  }

  // ── 크론 ──
  function renderCrons(){
    var el=document.getElementById('crons'); var list=S&&S.crons||[];
    document.getElementById('cron-meta').textContent=list.length?list.length+'개 (hermes '+list.filter(function(c){return c.source!=='host';}).length+' · host '+list.filter(function(c){return c.source==='host';}).length+')':'';
    if(!list.length){ el.innerHTML='<div class="empty">크론 정보 없음</div>'; return; }
    var rows=list.map(function(c){
      return '<tr><td>'+esc(c.name||'')+'<div class="muted mono">'+esc(c.id||'')+'</div></td><td>'+cronToKst(c.schedule_utc)+'<div class="muted mono">'+esc(c.schedule_utc||'')+'</div></td><td>'+(c.source==='host'?'<span class="tag host">host</span>':'<span class="tag">hermes</span>')+'</td><td>'+kst(c.last_run)+'<div class="muted">'+ago(c.last_run)+'</div></td><td>'+statusTag(c.last_status)+'</td><td>'+kst(c.next_run)+'</td>'+(c.note?'<td class="muted">'+esc(c.note)+'</td>':'<td></td>')+'</tr>';
    }).join('');
    el.innerHTML='<table><thead><tr><th>잡</th><th>스케줄</th><th>출처</th><th>마지막 실행</th><th>상태</th><th>다음 실행</th><th>비고</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }

  // ── 데이터 상태 ──
  function renderData(){
    var el=document.getElementById('datastat'); var d=S&&S.data||null;
    if(!d){ el.innerHTML='<div class="empty">데이터 상태 없음</div>'; return; }
    var t=d.toto||{}, k=d.kbo||{};
    var html='<div class="stat-row">';
    html+='<div class="stat"><div class="v">'+esc(t.round!=null?t.round+'회차':'-')+'</div><div class="k">토토 회차</div></div>';
    html+='<div class="stat"><div class="v">'+esc(t.rows!=null?t.rows:'-')+'</div><div class="k">행 수</div></div>';
    html+='<div class="stat"><div class="v">'+esc(t.history_changed_keys!=null?t.history_changed_keys:'-')+'</div><div class="k">배당 변동 키 / '+esc(t.history_keys!=null?t.history_keys:'-')+'</div></div>';
    html+='<div class="stat '+(t.verify==='PASS'?'green':t.verify==='FAIL'?'red':'')+'"><div class="v">'+esc(t.verify||'-')+'</div><div class="k">verify_toto'+(t.parse_drop!=null?' · drop '+t.parse_drop:'')+'</div></div>';
    html+='</div><div class="muted" style="font-size:12px;margin-bottom:14px">toto_data.js '+kst(t.generated_at)+' ('+ago(t.generated_at)+')'+(t.pages_ok===false?' · <span class="tag fail">Pages 응답 이상</span>':'')+'</div>';
    html+='<div class="stat-row">';
    html+='<div class="stat"><div class="v">'+esc(k.latest_date||'-')+'</div><div class="k">KBO 최신 파일</div></div>';
    html+='<div class="stat"><div class="v">'+esc(k.games!=null?k.games:'-')+'</div><div class="k">경기 수</div></div>';
    html+='<div class="stat '+(k.verify==='PASS'?'green':k.verify==='FAIL'?'red':'')+'"><div class="v">'+esc(k.verify||'-')+'</div><div class="k">verify_kbo_daily</div></div>';
    html+='</div><div class="muted" style="font-size:12px">'+esc(k.latest_file||'')+(k.collected_at?' · 수집 '+kst(k.collected_at):'')+(k.verify_at?' · 검수 '+kst(k.verify_at):'')+'</div>';
    el.innerHTML=html;
  }

  // ── 타임라인 (24h, 10분 슬롯 144칸) ──
  function renderTimeline(){
    var el=document.getElementById('timeline'); var runs=S&&S.runs_24h||[];
    var now=Date.now(), start=now-24*3600000;
    var slots=new Array(144).fill(null);
    var kboMarks=[];
    var ok=0,fail=0;
    runs.forEach(function(r){
      var t=new Date(r.ts).getTime(); if(isNaN(t)||t<start||t>now) return;
      var i=Math.min(143,Math.floor((t-start)/600000));
      if(r.pipeline==='kbo'){ kboMarks.push({i:i,status:r.status,ts:r.ts,note:r.note}); return; }
      var st=r.status==='fail'||r.verify==='FAIL'?'fail':(r.status==='warn'||(r.parse_drop>0)?'warn':'ok');
      if(!slots[i]||st==='fail') slots[i]=st;
      if(st==='fail')fail++; else ok++;
    });
    document.getElementById('tl-meta').textContent=runs.length?('토토 성공 '+ok+' · 실패 '+fail+' · KBO 실행 '+kboMarks.length):'';
    if(!runs.length){ el.innerHTML='<div class="empty">실행 기록 없음</div>'; return; }
    var cells=slots.map(function(s,i){ var t=new Date(start+i*600000); return '<div class="'+(s||'')+'" title="'+kst(t.toISOString())+(s?' · '+s:' · 기록 없음')+'"></div>'; }).join('');
    var axis=''; for(var h=0;h<=24;h+=4){ axis+='<span>'+kstTime(new Date(start+h*3600000).toISOString())+'</span>'; }
    var marks=kboMarks.map(function(m){ return '<span class="'+(m.status||'')+'" style="left:'+((m.i/144)*100).toFixed(2)+'%" title="'+esc(m.note||'')+'">KBO '+kstTime(m.ts)+' '+esc(m.status||'')+'</span>'; }).join('');
    el.innerHTML='<div class="tl">'+cells+'</div><div class="tl-axis">'+axis+'</div><div class="kbo-marks">'+marks+'</div>';
  }

  // ── hallucination_log ──
  function renderHallu(){
    var el=document.getElementById('hallu'); var list=S&&S.hallucination_log||[];
    if(!list.length){ el.innerHTML='<div class="empty">기록 없음</div>'; document.getElementById('hl-meta').textContent=''; return; }
    var self=list.filter(function(x){return x.corrected_by==='self';}).length, user=list.length-self;
    var byP={}; list.forEach(function(x){ var p=x.project||'?'; byP[p]=(byP[p]||0)+1; });
    document.getElementById('hl-meta').textContent='누적 '+list.length+'건';
    var html='<div class="stat-row"><div class="stat red"><div class="v">'+list.length+'</div><div class="k">누적</div></div><div class="stat green"><div class="v">'+self+'</div><div class="k">self 정정</div></div><div class="stat amber"><div class="v">'+user+'</div><div class="k">user 지적</div></div>';
    Object.keys(byP).forEach(function(p){ html+='<div class="stat"><div class="v">'+byP[p]+'</div><div class="k">'+esc(p)+'</div></div>'; });
    html+='</div><div class="muted" style="font-size:11px;margin-bottom:8px">self 비율 '+(list.length?Math.round(self/list.length*100):0)+'% — 높을수록 스스로 검증하는 습관이 자리잡은 것</div>';
    var sorted=list.slice().sort(function(a,b){ return new Date(b.timestamp)-new Date(a.timestamp); });
    html+='<div>'+sorted.slice(0,8).map(function(x){ return '<div class="hl-item"><div class="h"><span>'+kst(x.timestamp)+' · '+esc(x.project||'')+'</span><span class="tag '+(x.corrected_by==='self'?'ok':'warn')+'">'+esc(x.corrected_by||'')+'</span></div><div class="claim">✗ '+esc(x.false_claim||'')+'</div><div class="fact">✓ '+esc(x.actual_finding||'')+'</div></div>'; }).join('')+'</div>';
    if(sorted.length>8) html+='<details><summary>이전 '+(sorted.length-8)+'건 더 보기</summary>'+sorted.slice(8).map(function(x){ return '<div class="hl-item"><div class="h"><span>'+kst(x.timestamp)+' · '+esc(x.project||'')+'</span><span class="tag">'+esc(x.corrected_by||'')+'</span></div><div class="claim">✗ '+esc(x.false_claim||'')+'</div><div class="fact">✓ '+esc(x.actual_finding||'')+'</div></div>'; }).join('')+'</details>';
    el.innerHTML=html;
  }

  // ── 메모리 · 규칙 ──
  function renderMemRules(){
    var el=document.getElementById('memrules'); var m=S&&S.memory||null, rules=S&&S.rules||[];
    var html='';
    if(m&&m.usage_pct!=null){ var cls=m.usage_pct>=90?'fail':m.usage_pct>=75?'warn':'ok'; html+='<div style="font-size:13px">메모리 사용률 <b>'+m.usage_pct+'%</b>'+(m.entries!=null?' · 항목 '+m.entries+'개':'')+'</div><div class="bar '+cls+'"><i style="width:'+Math.min(100,m.usage_pct)+'%"></i></div>'; }
    else html+='<div class="muted" style="font-size:12px">메모리 정보 없음</div>';
    if(rules.length){ html+='<div style="margin-top:14px;font-size:12px;color:var(--dim)">OPERATING_RULES.md '+rules.length+'개 조항</div><ul class="rules">'+rules.map(function(r){ return '<li><span class="mono muted">'+esc(r.id||'')+'</span> '+esc(r.title||'')+'</li>'; }).join('')+'</ul>'; }
    el.innerHTML=html;
  }

  // ── 로그 ──
  function renderLogs(){
    var el=document.getElementById('logs'); var L=S&&S.logs||null;
    if(!L||(!L.kbo&&!L.toto)){ el.innerHTML='<div class="empty">로그 없음</div>'; return; }
    var html='<div class="grid-2">';
    if(L.kbo) html+='<div><div class="muted" style="font-size:12px;margin-bottom:6px">KBO 마지막 실행</div><pre class="log">'+esc(L.kbo)+'</pre></div>';
    if(L.toto) html+='<div><div class="muted" style="font-size:12px;margin-bottom:6px">토토 마지막 실행</div><pre class="log">'+esc(L.toto)+'</pre></div>';
    el.innerHTML=html+'</div>';
  }

  renderHeader(); renderPipelines(); renderCrons(); renderData(); renderTimeline(); renderHallu(); renderMemRules(); renderLogs();
  setInterval(renderHeader, 60000);
})();
</script>
</body>
</html>
